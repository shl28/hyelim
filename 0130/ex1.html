    <title>Document</title>
</head>
<body>
    <script>
        let num = 0;
        document.write('2단<br>');
        for(let i = 1; i <= 9; i++){
            num = 2 * i;
            document.write('2X' + i + '=' + num + '<br>');
        }
        document.write('3단<br>');
        for(let i = 1; i <= 9; i++){
            num = 3 * i;
            document.write('3X' + i + '=' + num + '<br>');
        }
