<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = 10;
        console.log(a);

        a = 20;
        // var : 재할당 가능
        console.log(a);

        var a = 30;
        // var : 재선언 가능
        console.log(a);

        // d = 40;
        // // 묵시적 선언 (자료형 명시 안하고도 가능)
        // console.log(d);

        let b = 11;
        console.log(b);

        b = 21;
        console.log(b);

        // let b = 12;
        // console.log(b);
        // let : 재선언 불가

        const c = 12;
        console.log(c);

        // c = 13;
        // console.log(c);
        // const : 재선언 및 재할당 불가

    </script>
</body>
</html>
