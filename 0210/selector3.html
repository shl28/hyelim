<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="parent">
        <p id="child">Hello</p>
    </div>

    <script>
        const child = document.getElementById('child');
        const a = child.parentNode;
        // parentNode : 자식에서 부모를 찾을 때 사용
        console.log(a.id);
        
    </script>
</body>
</html>
