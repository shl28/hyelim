<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      width: 150px;
      height: 150px;
      position: absolute;
    }
    .box1{
      left: 0;
      top: 0;
      background-color: aqua;
    }
    .box2{
      right: 0;
      top: 0;
      background-color: lightcoral;
    }
    .box3{
      right: 0;
      bottom: 0;
      /* position: static; 기본값, 생략되어 있음 */
      background-color: lightgreen;
    }
    .box4{
      left: 0;
      bottom: 0;
      background-color: lightgoldenrodyellow;
      border-radius: 50%;
      /* 모서리 둥글게 50% 원이 됨 (넓이 높이 같은 정사각일 때) */
    }
    .box5{
      left: 50%;
      top: 50%;
      background-color: lavender;
      /* 정중앙에 배치하기 */
      margin-left: -75px;
      margin-top: -75px;
      /* transform: translate(-50%, -50%); */
      /*  transform: translate 본인 넓이, 높이 에서 50% 이동 */
      transform: rotate(45deg);
      /* rotate(회전): 45도 돌아감 */
    }
  </style>
</head>
<body>
  <div class="box box1">박스1</div>
  <div class="box box2">박스2</div>
  <div class="box box3">박스3</div>
  <div class="box box4">박스4</div>
  <div class="box box5">박스센터</div>
</body>
</html>
