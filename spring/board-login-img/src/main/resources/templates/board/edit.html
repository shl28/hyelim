<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>글수정</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.35rem; }
    label { display: block; margin-top: 0.75rem; font-weight: 600; }
    input[type="text"] { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
    textarea { width: 100%; min-height: 220px; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; font-family: inherit; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
    .field-err { color: #a00; font-size: 0.85rem; margin-top: 0.2rem; }
    .nav { margin-bottom: 1rem; }
    a { color: #06c; }
    .hint { font-size: 0.85rem; color: #666; margin-top: 0.35rem; }
    .existing-images {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 0.5rem 0;
    }
    .image-item {
      border: 1px solid #ddd;
      padding: 0.5rem;
      border-radius: 4px;
      text-align: center;
    }
    .image-item label {
      font-weight: normal;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
<div class="nav">
  <a th:href="@{/posts/{id}(id=${postId})}">글 보기</a>
  · <a th:href="@{/posts}">목록</a>
</div>
<h1>글수정</h1>
<p th:if="${error}" class="err" th:text="${error}"></p>
<form th:action="@{/posts/{id}/edit(id=${postId})}" th:object="${form}" method="post" enctype="multipart/form-data">
  <label for="title">제목</label>
  <input type="text" id="title" th:field="*{title}" maxlength="200"/>
  <p class="field-err" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
  <label for="content">내용</label>
  <textarea id="content" th:field="*{content}"></textarea>
  <p class="field-err" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>

<!--  기존 이미지-->
  <label>기존 이미지</label>
  <div class="existing-images" th:if="${not #lists.isEmpty(existingImages)}">
    <div class="image-item" th:each="img : ${existingImages}">
      <img th:src="@{/uploads/{n}(n=${img.thumbnailSavedName})}" alt="썸네일" width="100"/>
      <p th:text="${img.originalName}" class="hint">파일명</p>
      <label>
        <input type="checkbox" name="deleteImageIds" th:value="${img.id}"/>
        삭제
      </label>
    </div>
  </div>
  <p th:if="${#lists.isEmpty(existingImages)}" class="hint">첨부 이미지가 없습니다.</p>

<!--  새 이미지 추가-->
  <label for="files">이미지 추가</label>
  <input type="file" id="files" name="files" multiple accept="image/*">
  <p class="hint">기존 이미지를 유지하려면 체크박스를 비워두세요. 삭제할 이미지만 체크하세요.</p>

  <button type="submit">저장</button>
</form>
</body>
</html>
