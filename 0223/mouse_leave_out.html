<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-4.0.0.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            margin: 20px;
        }

        #wrap {
            background-color: #ccc;
            padding: 20px;
        }

        p {
            background-color: #999;
        }
    </style>

    <script>
        // $(function(){
        //     $('#wrap').mouseleave(function(){
        //         $('p').css('border', '2px dashed red');
        //     });
        // });
        $(function(){
            $('#wrap').mouseout(function(){
                $('p').css('border', '2px dashed red');
            });
        });
        // mouseleave : #wrap 안의 영역에서 떠났을 때 이벤트 동작 (#wrap 안의 자식 p 태그 포함)
        // mouseout : #wrap 안의 p영역에 들어가도 이벤트 (#wrap 안의 자식 p 태그 제외)
    </script>
</head>
<body>
    <div id="wrap">
        <p>내용</p>
    </div>
</body>
</html>
