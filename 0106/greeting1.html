<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

<style>
table{
  border: 1px solid #333;
  border-collapse: collapse;
  margin-left: auto;
  margin-right: auto;
  margin-top: 20px;
}
td{
  border: 1px solid #333;
  padding: 5px 10px;
}
.tit_img{
  background-image: url(images/abc.png);
  background-repeat: no-repeat;
  background-position: 50% 50%;
  background-size: cover;
  /* 화면 꽉 채우기 */
}
.title{
  font-weight: bold;
  background-color: #f5f5f5;
}
</style>
</head>
<body>
  <table>
    <colgroup>
    <col style="width: 150px;">
    <col style="width: 150px;">
    <col style="width: 420px;">
    </colgroup>
    <tr>
      <td rowspan="5" class="tit_img"></td>
      <td class="title">이름</td>
      <td>서혜림</td>
    </tr>
    <tr>
      <td class="title">사는곳</td>
      <td>경기도 광주시</td>
    </tr>
    <tr>
      <td class="title">경력</td>
      <td>웹·자바 개발 및 IT 교육 경력</td>
    </tr>
    <tr>
      <td class="title">전문분야</td>
      <td>Java, Spring Boot, Html/Css, Javascript</td>
    </tr>
    <tr>
      <td class="title">자기소개</td>
      <td>어려운 코딩 개념을 쉽게 설명하는 것을 목표로 하고 있으며, <br>
      실무에 바로 적용 가능한 예제 중심의 강의를 진행합니다.</td>
    </tr>
  </table>
</body>
</html>
