<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function sayHello(name){
            alert(name + '님 환영합니다.');
        }
    </script>
</head>
<body>
    <!-- 인라인 값(인수) 전달하기 : 인수에 '' 사용-->
    <button onclick="sayHello('홍길동')">버튼</button>    
</body>
</html>
