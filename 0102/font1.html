<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap');
/*  <weight>: Use a value from 100 to 900
    <uniquifier>: Use a unique and descriptive class name */

body {
  font-family: "Noto Sans KR", sans-serif; 
  /* sans-serif : 글자 깨질 경우, 유사 고딕체로 변경 */
  font-size: 32px;
}
.f1{font-weight: 100;}
.f2{font-weight: 400;}
.f3{font-weight: 700;}
.f4{font-weight: 900;}
.f5{font-weight: 100;}
</style>
</head>
<body>
  <!-- Noto Sans Kr 글씨체를 적용해서 굵기를 100 400 700 900 적용 -->
  <p class="f1">폰트 연습1</p>
  <p class="f2">폰트 연습2</p>
  <p class="f3">폰트 연습3</p>
  <p class="f4">폰트 연습4</p>
  <p class="f5">폰트 연습5</p>
</body>
</html>
