<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-buttons button {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            background-color: #eee;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .tab-buttons button.active {
            background-color: #007Bff;
            color: white
        }

        .tab-content {
            display: none;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <h2>탭 메뉴 예제</h2>

    <div class="tab-buttons">
        <button class="tab-link active" data-tab="tab1">🍎 사과</button>
        <button class="tab-link" data-tab="tab2">🍌 바나나</button>
        <button class="tab-link" data-tab="tab3">🍇 포도</button>
    </div>

    <div id="tab1" class="tab-content active">사과는 빨갛고 달콤합니다.</div>
    <div id="tab2" class="tab-content">바나나는 노랗고 길쭉합니다.</div>
    <div id="tab3" class="tab-content">포도는 보라색이고 송이로 열립니다.</div>
</body>
</html>

<script>
    const tabLinks = document.querySelectorAll('.tab-link');
    const tabContents = document.querySelectorAll('.tab-content');

    tabLinks.forEach(function(button){
        button.addEventListener('click', () => {
            const targetId = button.getAttribute("data-tab");

            tabLinks.forEach(btn => btn.classList.remove('active'));
            tabContents.forEach(content => content.classList.remove('active'));

            button.classList.add('active');
            document.getElementById(targetId).classList.add('active');
        });
    });
</script>
