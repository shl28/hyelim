<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shlex</title>
  <link rel="stylesheet" href="css/shlex1.css">
</head>

<body>
  <div class="container">
    <div class="contents">
      <section class="box1">
        <h1>Franchise</h1>
        <h4>브랜드 창업을 검토하실 때 꼭 필요합니다.</h4>
      </section>
      <section class="box2">
        <div class="lbox1">
          <img src="imgs/franchise_ico1.png" alt="">
          <p class="txt1">1</p>
          <p class="txt2">창업설명회&개별상담</p>
          <p class="txt3">가맹점지원서 및 상권조사표 작성</p>
        </div>
        <div class="lbox2">
          <img src="imgs/franchise_ico2.png" alt="">
          <p class="txt1">2</p>
          <p class="txt2">타겟 입지</p>
          <p class="txt3">브랜드는 주로 메인상권<br>지역에 개설됩니다.</p>
        </div>
        <div class="lbox3">
          <img src="imgs/franchise_ico3.png" alt="">
          <p class="txt1">3</p>
          <p class="txt2">필요면적</p>
          <p class="txt3">브랜드는 지상 1층,<br>전용면적 최소 50m²(15PY)/<br>
            지상2층, 전용면적 최소 66m²(20PY)의<br>공간이 필요합니다.</p>
        </div>
        <div class="lbox4">
          <img src="imgs/franchise_ico4.png" alt="">
          <p class="txt1">4</p>
          <p class="txt2">창업 가능 지역</p>
          <p class="txt3">전국 상권 진행가능(세주 제외),<br>상권 상담은 창업문의에 남겨주세요.</p>
        </div>
      </section>
      <section class="box3">
        <div class="bbox1">
          <p class="text1">
            본사와 가맹점주가 상생할 수 있는<br>지속성 있는 <span class="bold">브랜드의 개발과 경영방침</span>을 추구합니다.
          </p>
        </div>
        <div class="bbox2">
          <p class="text2">
            창업설명회 신청/문의
          </p>
        </div>
      </section>
    </div>
  </div>

</body>

</html>
