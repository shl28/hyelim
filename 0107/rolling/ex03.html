<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    section {
      width: 1000px;
      height: 500px;
      border: 1px solid #333;
      margin-left: auto;
      margin-right: auto;
    }

    .left {
      width: 700px;
      height: 500px;
      float: left;
    }

    .left .top {
      width: 700px;
      height: 250px;
      background-color: aqua;
    }

    .left .bottom {
      width: 700px;
      height: 250px;
      background-color: blue;
    }

    .right {
      width: 300px;
      height: 500px;
      background-color: chartreuse;
      float: left;
    }
  </style>
</head>

<body>
  <section>
    <div class="left">
      <div class="top">왼쪽 위</div>
      <div class="bottom">왼쪽 아래</div>
    </div>
    <div class="right">오른쪽</div>
  </section>
</body>

</html>
